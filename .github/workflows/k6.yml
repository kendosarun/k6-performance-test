name: k6 Performance

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL"
        required: true
      profile:
        description: "Profile"
        required: true
        default: "load"
        type: choice
        options:
          - load
          - stress
          - spike
          - endurance

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  k6:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Prepare reports
        run: mkdir -p reports

      - name: Run k6 test
        run: |
          k6 run tests/performance.js \
            --summary-export=reports/summary.json
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          PROFILE: ${{ github.event.inputs.profile }}
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_EXPORT: "reports/index.html"

      - name: Verify reports
        run: ls -la reports

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Upload K6 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: reports/
          retention-days: 14

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
  
      - run: echo "K6 Dashboard 👉 ${{ steps.deployment.outputs.page_url }}"

      - name: Show Dashboard URL
        run: echo "K6 Dashboard 👉 ${{ steps.deployment.outputs.page_url }}"
